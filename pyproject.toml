[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-network-asserts"
version = "0.2.0"
description = "AWS network assertions with Config, Reachability Analyzer and opt-in Lambda or SSM probes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["boto3>=1.35,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aws_network_asserts = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["aws: opt-in tests that contact the configured AWS API endpoint"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

